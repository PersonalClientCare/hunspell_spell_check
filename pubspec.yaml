name: hunspell_spell_check

version: 0.3.0

homepage: "https://github.com/PersonalClientCare/hunspell_spell_check"

description: Hunspell-backed spell checking for Flutter desktop. Provides a
  SpellCheckService and SpellCheckConfiguration for standard Flutter text
  fields, plus a low-level checker facade for custom editors.

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  code_assets: ^1.0.0
  ffi: "^2.1.2"
  flutter:
    sdk: flutter
  hooks: ^1.0.3
  logging: "^1.2.0"
  native_toolchain_rust: ^1.0.3
  path: ^1.9.1
  path_provider: "^2.1.2"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

platforms:
  linux:
  macos:
  windows:

topics:
  - spellcheck
  - hunspell
  - text-fields

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
