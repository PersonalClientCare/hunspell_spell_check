name: hunspell_spell_check

version: 0.3.4

homepage: "https://github.com/PersonalClientCare/hunspell_spell_check"

description: Hunspell-backed spell checking for Flutter desktop.

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.6
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

platforms:
  linux:
  macos:
  windows:

topics:
  - spellcheck
  - hunspell
  - text-fields

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
